name: 💡 Suggestion
description: An idea for a new feature or an improvement
title: "[Idea] "
labels: ["suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should we add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
  - type: textarea
    id: media
    attributes:
      label: Sketches, screenshots or examples (optional)
