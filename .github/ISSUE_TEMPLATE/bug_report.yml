name: 🐛 Bug report
description: Something is broken or not working the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the problem
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Lobby / city, Shop or menu, Tutorial, In a match, Crate opening, Other]
    validations:
      required: true
  - type: input
    id: map
    attributes:
      label: Map, difficulty and wave (if in a match)
      placeholder: "e.g. Zombie Castle, Hard, wave 23"
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [Windows PC, Mac, Phone, Tablet, Console]
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: Drag and drop files here.
